name: CI and deploy

# Pull requests: tests and a production build.
# main: the same checks, then images are pushed to GHCR and deployed over SSH.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grit
          POSTGRES_PASSWORD: grit
          POSTGRES_DB: grit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grit -d grit_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://grit:grit@localhost:5432/grit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q -p no:warnings

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  images:
    name: Build and push images
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.names.outputs.api }}
      web: ${{ steps.names.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api=$base-api:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "web=$base-web:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "api_latest=$base-api:latest" >> "$GITHUB_OUTPUT"
          echo "web_latest=$base-web:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both architectures, so any Oracle shape works (Ampere arm64 or AMD x86).
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.api }},${{ steps.names.outputs.api_latest }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.web }},${{ steps.names.outputs.web_latest }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to server
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ steps.site.outputs.url }}
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
      DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        env:
          HAS_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing variable DEPLOY_HOST,"
          [ "$HAS_KEY" = "true" ] || missing="$missing secret SSH_PRIVATE_KEY,"
          if [ -n "$missing" ]; then
            echo "::error::Add the repository${missing%,} (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - id: site
        run: |
          if [ -n "$DOMAIN" ]; then
            echo "address=$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "address=:80" >> "$GITHUB_OUTPUT"
            echo "url=http://$HOST" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -H "$HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  ServerAliveInterval 30\n' \
            "$HOST" "$DEPLOY_USER" > ~/.ssh/config
          ssh server 'echo "Connected to $(hostname) ($(uname -m))"'
      - name: Deploy
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh server 'mkdir -p ~/grit-interviews'
          scp -q deploy/docker-compose.yml server:grit-interviews/docker-compose.yml
          {
            echo "API_IMAGE=${{ needs.images.outputs.api }}"
            echo "WEB_IMAGE=${{ needs.images.outputs.web }}"
            echo "SITE_ADDRESS=${{ steps.site.outputs.address }}"
            echo "PUBLIC_URL=${{ steps.site.outputs.url }}"
            echo "REGISTRY_USER=${{ github.actor }}"
            echo "REGISTRY_TOKEN=$REGISTRY_TOKEN"
          } | ssh server 'umask 077; cat > ~/grit-interviews/.deploy.env'
          ssh server 'bash -s' < deploy/remote.sh
      - name: Check the live site
        run: |
          url="${{ steps.site.outputs.url }}"
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 10 "$url/api/health"; then
              echo; echo "Live at $url"; exit 0
            fi
            sleep 6
          done
          echo "::error::The app is running on the server but $url isn't reachable. In Oracle Cloud, add ingress rules for TCP 80 and 443 (source 0.0.0.0/0) to the instance's subnet security list."
          exit 1
      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
