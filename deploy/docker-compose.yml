# Production stack, run on the server by deploy/remote.sh.
# Images come from GitHub Container Registry; secrets come from .env on the server.
name: grit-interviews

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing from .env}
      POSTGRES_DB: grit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grit -d grit"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: ${API_IMAGE:?set by the deploy}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://grit:${POSTGRES_PASSWORD}@db:5432/grit
      JWT_SECRET: ${JWT_SECRET:?missing from .env}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    image: ${WEB_IMAGE:?set by the deploy}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
